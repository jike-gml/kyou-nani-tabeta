    /* 軽量なUIアニメーション */
    button,.home-meal,.meal-tab,.all-meal-row,.thumb-box{transition:transform .15s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,opacity .18s ease}
    button:not(:disabled):active{transform:scale(.97)}
    .meal-tab.is-active{transition:transform .18s ease,box-shadow .18s ease,background-color .22s ease}
    #homeView:not([hidden]),#calendarView:not([hidden]){animation:viewIn .22s ease both}
    .past-menu-panel:not([hidden]){animation:panelIn .22s cubic-bezier(.2,.75,.3,1) both}
    .detail-overlay:not([hidden]){animation:overlayIn .18s ease both}
    .detail-overlay:not([hidden]) .detail-modal-panel{animation:modalIn .26s cubic-bezier(.18,.82,.32,1) both}
    .thumb-box.has-photo img{animation:photoIn .24s ease both;transition:transform .22s ease}
    .caption-block:not([hidden]),.dish-name-actions:not([hidden]),.memo-editor:not([hidden]){animation:contentIn .2s ease both}
    .status:not(:empty){animation:statusIn .2s ease both}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

<body>
  <main class="app-shell">
    <section id="homeView">
      <header class="hero">
        <div class="hero-eyebrow">DAILY MEAL JOURNAL</div>
        <h1>今日なに食べた？</h1>

      </header>
      <div class="today-line"><div><span class="today-kicker">TODAY</span><strong id="todayLabel"></strong></div><span>きょうの食事</span></div>
      <section id="dailyProgress" class="daily-progress" aria-labelledby="progressTitle">
        <div class="progress-top"><strong id="progressTitle">3食チャレンジ</strong><strong id="progressCount" aria-live="polite">0 / 3</strong></div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="朝・昼・夕の記録数" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-steps" aria-hidden="true"><span data-progress-meal="breakfast">朝食</span><span data-progress-meal="lunch">昼食</span><span data-progress-meal="dinner">夕食</span></div>

      <div class="meal-home-grid" aria-label="今日の食事を記録">

        <button class="home-meal" data-home-meal="lunch" type="button">昼食<small>写真を撮る</small></button>
        <button class="home-meal" data-home-meal="dinner" type="button">夕食<small>写真を撮る</small></button>
        <button class="home-meal" data-home-meal="snack" type="button">間食<small>写真を撮る</small></button>
      </div>
      <button id="openCalendar" class="calendar-open" type="button">カレンダーを見る</button>
      <button id="openPastMenus" class="past-menu-open" type="button" aria-expanded="false" aria-controls="pastMenusPanel">過去メニュー（10日分）</button>
      <section id="pastMenusPanel" class="past-menu-panel" hidden>
        <div class="past-menu-toolbar"><strong>過去メニュー</strong><button id="copyPastMenus" class="secondary-button" type="button">コピー</button></div>
        <div id="pastMenusText" class="past-menu-text"></div>
        <p id="pastMenusStatus" class="past-menu-status" role="status" aria-live="polite"></p>

      <p id="homeStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="calendarView" hidden>
      <div class="calendar-fixed">
        <div class="view-header"><button id="backHome" class="back-button" type="button">ホーム</button><div class="view-title"><h2>カレンダー</h2><p>直近2か月の食事写真</p></div></div>
        <nav class="meal-tabs" aria-label="食事の切り替え">
          <button class="meal-tab meal-tab-all is-active" data-meal="all" type="button">全食</button>
          <button class="meal-tab meal-tab-breakfast" data-meal="breakfast" type="button">朝食</button>
          <button class="meal-tab meal-tab-lunch" data-meal="lunch" type="button">昼食</button>

        <section class="calendar-toolbar" aria-label="月の切り替え"><button id="prevMonth" class="icon-button" type="button" aria-label="前の月">‹</button><div class="month-center"><strong id="monthLabel"></strong><span id="retentionLabel"></span></div><button id="nextMonth" class="icon-button" type="button" aria-label="次の月">›</button></section>

      </div>

    <section id="detailView" class="detail-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">

        <div class="view-header"><button id="backCalendar" class="back-button" type="button">戻る</button><div class="view-title"><h2 id="detailTitle">食事の記録</h2><p>写真と料理名</p></div></div>

          <div id="dishNameActions" class="dish-name-actions" hidden><button id="editDishName" class="secondary-button" type="button">編集</button><button id="deleteDishName" class="danger-button" type="button">削除</button></div>
          <div id="dishNameEditor" class="memo-editor"><label for="detailMemo">料理名</label><textarea id="detailMemo" maxlength="200" placeholder="料理名を入力"></textarea><div class="memo-row"><span class="memo-hint">200文字まで</span><button id="saveMemo" class="primary-button" type="button">料理名を保存</button></div></div>
          <div class="photo-actions"><button id="replaceButton" class="secondary-button" type="button">写真を撮り直す</button><button id="deleteButton" class="danger-button" type="button">写真を削除</button></div>

    <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
  </main>
<script>
const APP={dbName:'foodlog-db',dbVersion:1,storeName:'records',fullWidth:960,fullHeight:720,fullQuality:.68,thumbWidth:240,thumbHeight:180,thumbQuality:.58,mealNames:{breakfast:'朝食',lunch:'昼食',dinner:'夕食',snack:'間食'},shortMealNames:{breakfast:'朝',lunch:'昼',dinner:'夜',snack:'間'},mealMarks:{breakfast:'朝',lunch:'昼',dinner:'夕',snack:'間'},mealIcons:{breakfast:'☀️',lunch:'🍱',dinner:'🍽️',snack:'🍪'}};
const state={db:null,meal:'breakfast',detailMeal:null,calendarMode:'all',today:startOfDay(new Date()),viewedMonth:startOfMonth(new Date()),selectedDate:toDateKey(new Date()),records:new Map(),calendarObjectUrls:new Set(),detailObjectUrl:null,midnightTimer:null,pending:null,captureContext:null,currentView:'home',detailTouchStartX:null,detailTouchStartY:null};
const els={};
window.addEventListener('DOMContentLoaded',init);window.addEventListener('beforeunload',cleanupAllObjectUrls);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTodayIfNeeded()});
async function init(){bindElements();bindEvents();try{state.db=await openDatabase();await migrateLegacyDinnerRecords();await purgeExpiredRecords();await refreshRecords();renderHome();renderCalendar();history.replaceState({foodlogView:'home'},'',location.href);showView('home');setHomeStatus('写真は端末内に保存され、当月＋前月の2か月だけ保持します。');scheduleMidnightRefresh()}catch(error){console.error(error);setHomeStatus('保存領域を開けませんでした。このブラウザでは利用できない可能性があります。')}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
function bindElements(){for(const id of ['homeView','calendarView','detailView','todayLabel','progressCount','progressTrack','progressFill','progressMessage','dailyProgress','openCalendar','openPastMenus','pastMenusPanel','pastMenusText','copyPastMenus','pastMenusStatus','homeStatus','backHome','prevMonth','nextMonth','monthLabel','retentionLabel','calendarGrid','calendarStatus','backCalendar','detailTitle','detailSwipeArea','detailMealBadge','detailImage','captionBlock','dishNameActions','editDishName','deleteDishName','dishNameEditor','detailMemo','saveMemo','replaceButton','deleteButton','detailStatus','photoInput'])els[id]=document.getElementById(id);els.homeMealButtons=[...document.querySelectorAll('[data-home-meal]')];els.progressSteps=[...document.querySelectorAll('[data-progress-meal]')];els.mealTabs=[...document.querySelectorAll('.meal-tab')]}
function bindEvents(){els.homeMealButtons.forEach(button=>button.addEventListener('click',()=>startCapture({date:toDateKey(state.today),meal:button.dataset.homeMeal,returnView:'home',mode:'new'})));els.openCalendar.addEventListener('click',()=>{state.viewedMonth=startOfMonth(state.today);state.selectedDate=toDateKey(state.today);state.calendarMode='all';renderCalendar();history.pushState({foodlogView:'calendar'},'',location.href);showView('calendar')});els.openPastMenus.addEventListener('click',togglePastMenus);els.copyPastMenus.addEventListener('click',copyPastMenusText);els.backHome.addEventListener('click',goHomeFromCalendar);window.addEventListener('popstate',()=>{if(state.currentView==='detail'){closeDetailModalNow();return}if(state.currentView==='calendar'){renderHome();showView('home')}});els.mealTabs.forEach(button=>button.addEventListener('click',()=>{state.calendarMode=button.dataset.meal;if(state.calendarMode!=='all')state.meal=state.calendarMode;renderCalendar()}));els.prevMonth.addEventListener('click',()=>changeMonth(-1));els.nextMonth.addEventListener('click',()=>changeMonth(1));els.backCalendar.addEventListener('click',requestCloseDetailModal);els.detailView.addEventListener('click',event=>{if(event.target===els.detailView)requestCloseDetailModal()});els.detailSwipeArea.addEventListener('touchstart',handleDetailTouchStart,{passive:true});els.detailSwipeArea.addEventListener('touchend',handleDetailTouchEnd,{passive:true});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.currentView==='detail')requestCloseDetailModal()});els.editDishName.addEventListener('click',startDishNameEdit);els.deleteDishName.addEventListener('click',deleteDishNameValue);els.replaceButton.addEventListener('click',()=>{const meal=state.detailMeal||state.meal;startCapture({date:state.selectedDate,meal,returnView:'detail',mode:'replace'})});els.deleteButton.addEventListener('click',deleteSelectedRecord);els.saveMemo.addEventListener('click',saveDetailMemo);els.photoInput.addEventListener('change',handlePhotoSelection)}
function openDatabase(){return new Promise((resolve,reject)=>{const request=indexedDB.open(APP.dbName,APP.dbVersion);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(APP.storeName)){const store=db.createObjectStore(APP.storeName,{keyPath:'key'});store.createIndex('date','date',{unique:false})}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function getAllRecords(){return new Promise((resolve,reject)=>{const tx=state.db.transaction(APP.storeName,'readonly');const request=tx.objectStore(APP.storeName).getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error)})}
function putRecord(record){return new Promise((resolve,reject)=>{const tx=state.db.transaction(APP.storeName,'readwrite');tx.objectStore(APP.storeName).put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function deleteRecord(key){return new Promise((resolve,reject)=>{const tx=state.db.transaction(APP.storeName,'readwrite');tx.objectStore(APP.storeName).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function migrateLegacyDinnerRecords(){const all=await getAllRecords();const existing=new Set(all.map(r=>r.key));for(const record of all){const normalized=normalizeMeal(record.meal);if(normalized===record.meal&&record.key===recordKey(record.date,normalized))continue;const key=recordKey(record.date,normalized);if(!existing.has(key)){await putRecord({...record,key,meal:normalized});existing.add(key)}if(record.key!==key)await deleteRecord(record.key)}}
async function refreshRecords(){const all=await getAllRecords();state.records=new Map(all.map(r=>[recordKey(r.date,r.meal),{...r,meal:normalizeMeal(r.meal)}]))}
async function purgeExpiredRecords(){const cutoff=retentionStartDate();const all=await getAllRecords();for(const record of all.filter(r=>parseDateKey(r.date)<cutoff))await deleteRecord(record.key)}
function retentionStartDate(){const firstThisMonth=startOfMonth(state.today);return new Date(firstThisMonth.getFullYear(),firstThisMonth.getMonth()-1,1)}function retentionEndDate(){return new Date(state.today.getFullYear(),state.today.getMonth()+1,0,23,59,59)}
function goHomeFromCalendar(){renderHome();showView('home')}
function showView(name){state.currentView=name;const isDetail=name==='detail';els.homeView.hidden=name!=='home';els.calendarView.hidden=!(name==='calendar'||isDetail);els.detailView.hidden=!isDetail;document.body.classList.toggle('modal-open',isDetail);if(!isDetail)window.scrollTo({top:0,behavior:'auto'})}
function mainMealCount(dateKey){return ['breakfast','lunch','dinner'].filter(meal=>state.records.has(recordKey(dateKey,meal))).length}
function renderDailyProgress(){const dateKey=toDateKey(state.today),count=mainMealCount(dateKey);els.progressCount.textContent=`${count} / 3`;els.progressTrack.setAttribute('aria-valuenow',String(count));els.progressFill.style.width=`${count/3*100}%`;els.progressSteps.forEach(step=>{const recorded=state.records.has(recordKey(dateKey,step.dataset.progressMeal));step.classList.toggle('is-done',recorded);step.textContent=`${recorded?'✓ ':''}${APP.mealNames[step.dataset.progressMeal]}`});els.progressMessage.textContent=count===3?'3食コンプリート！ 今日の記録がそろいました。':count===2?'あと1食でコンプリート！':count===1?'いいスタート！ あと2食で達成。':'朝・昼・夕を記録して、1日を完成させよう。';els.dailyProgress?.classList.toggle('is-complete',count===3)}
function renderHome(){const todayKey=toDateKey(state.today);els.todayLabel.textContent=formatDateWithWeekday(state.today);els.homeMealButtons.forEach(button=>{const meal=button.dataset.homeMeal,recorded=state.records.has(recordKey(todayKey,meal));button.disabled=recorded;button.classList.toggle('is-recorded',recorded);button.innerHTML=`<span class="home-meal-icon" aria-hidden="true">${APP.mealIcons[meal]}</span><span class="home-meal-label">${APP.mealNames[meal]}</span><small>${recorded?'✓ 記録済み':'＋ 写真を記録'}</small>`});renderDailyProgress();renderPastMenus()}
function buildPastMenusText(){const lines=['過去１０日間のメニューは以下です。',''];for(let offset=0;offset<10;offset++){const date=new Date(state.today);date.setDate(date.getDate()-offset);const record=state.records.get(recordKey(toDateKey(date),'dinner'));const memo=String(record?.memo||'').trim();if(memo)lines.push(`・${memo}`)}return lines.join('\n')}
function renderPastMenus(){els.pastMenusText.textContent=buildPastMenusText();els.pastMenusStatus.textContent=''}
function togglePastMenus(){const willShow=els.pastMenusPanel.hidden;if(willShow)renderPastMenus();els.pastMenusPanel.hidden=!willShow;els.openPastMenus.setAttribute('aria-expanded',String(willShow))}
async function copyPastMenusText(){const text=els.pastMenusText.textContent||buildPastMenusText();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{fallbackCopyText(text)}els.pastMenusStatus.textContent='コピーしました。'}catch(error){console.error(error);els.pastMenusStatus.textContent='コピーできませんでした。長押しで選択してコピーしてください。'}}
function fallbackCopyText(text){const textarea=document.createElement('textarea');textarea.value=text;textarea.setAttribute('readonly','');textarea.style.position='fixed';textarea.style.opacity='0';textarea.style.pointerEvents='none';document.body.appendChild(textarea);textarea.select();const copied=document.execCommand('copy');textarea.remove();if(!copied)throw new Error('copy failed')}
function renderCalendar(){renderMealTabs();renderMonthHeader();renderCalendarGrid()}
function renderMealTabs(){els.mealTabs.forEach(button=>{const active=button.dataset.meal===state.calendarMode;button.classList.toggle('is-active',active);button.setAttribute('aria-pressed',String(active))})}
function renderMonthHeader(){const y=state.viewedMonth.getFullYear(),m=state.viewedMonth.getMonth()+1;els.monthLabel.textContent=`${y}年 ${m}月`;const start=retentionStartDate(),end=retentionEndDate();els.retentionLabel.textContent=`${start.getMonth()+1}月1日〜${end.getMonth()+1}月末を保持`;els.prevMonth.disabled=state.viewedMonth<=startOfMonth(start);els.nextMonth.disabled=state.viewedMonth>=startOfMonth(state.today)}
function openRecord(dateKey,meal){const record=state.records.get(recordKey(dateKey,meal));if(!record?.fullBlob)return;state.selectedDate=dateKey;state.meal=meal;state.detailMeal=meal;history.pushState({foodlogView:'detail'},'',location.href);openDetailPage(meal)}
function renderCalendarGrid(){cleanupCalendarObjectUrls();els.calendarGrid.innerHTML='';const mode=state.calendarMode,year=state.viewedMonth.getFullYear(),month=state.viewedMonth.getMonth(),firstDay=new Date(year,month,1),dayCount=new Date(year,month+1,0).getDate();els.calendarGrid.classList.toggle('is-all',mode==='all');for(let i=0;i<firstDay.getDay();i++){const blank=document.createElement('div');blank.className='day-blank';els.calendarGrid.appendChild(blank)}for(let day=1;day<=dayCount;day++){const dateKey=toDateKey(new Date(year,month,day)),cell=document.createElement('div');cell.className='day-cell';if(dateKey===toDateKey(state.today))cell.classList.add('is-today');const number=document.createElement('span');number.className='day-number';number.textContent=String(day);cell.appendChild(number);if(mode==='all'){const list=document.createElement('div');list.className='all-meal-list';for(const meal of ['breakfast','lunch','dinner','snack']){const record=state.records.get(recordKey(dateKey,meal)),hasPhoto=Boolean(record?.fullBlob),hasDishName=Boolean(String(record?.memo||'').trim());const row=document.createElement('button');row.type='button';row.className=`all-meal-row ${meal}${hasPhoto?' is-recorded':''}`;row.disabled=!hasPhoto;row.setAttribute('aria-label',`${month+1}月${day}日・${APP.mealNames[meal]}${hasPhoto?'の詳細を開く':'は未記録'}${hasDishName?'・料理名登録済み':''}`);row.innerHTML=`<span class="meal-mark${hasPhoto?'':' is-empty'}${hasDishName?' has-name':''}" aria-hidden="true">${APP.mealMarks[meal]}</span>`;if(hasPhoto)row.addEventListener('click',()=>openRecord(dateKey,meal));list.appendChild(row)}cell.appendChild(list)}else{const record=state.records.get(recordKey(dateKey,mode)),thumb=document.createElement(record?.thumbBlob?'button':'div');thumb.className=`thumb-box${record?.thumbBlob?' has-photo':''}`;if(record?.thumbBlob){thumb.type='button';thumb.setAttribute('aria-label',`${month+1}月${day}日・${APP.mealNames[mode]}の詳細を開く${String(record.memo||'').trim()?'・料理名登録済み':''}`);const img=document.createElement('img'),url=URL.createObjectURL(record.thumbBlob);state.calendarObjectUrls.add(url);img.src=url;img.alt=`${month+1}月${day}日・${APP.shortMealNames[mode]}の写真`;thumb.appendChild(img);if(String(record.memo||'').trim()){const badge=document.createElement('span');badge.className='dish-name-badge';badge.textContent='○';badge.setAttribute('aria-hidden','true');thumb.appendChild(badge)}thumb.addEventListener('click',()=>openRecord(dateKey,mode))}cell.appendChild(thumb)}els.calendarGrid.appendChild(cell)}}
function handleDetailTouchStart(event){if(state.currentView!=='detail')return;const touch=event.touches?.[0];if(!touch)return;state.detailTouchStartX=touch.clientX;state.detailTouchStartY=touch.clientY}
function handleDetailTouchEnd(event){if(state.currentView!=='detail'||state.detailTouchStartX===null||state.detailTouchStartY===null)return;const touch=event.changedTouches?.[0];if(!touch)return;const dx=touch.clientX-state.detailTouchStartX,dy=touch.clientY-state.detailTouchStartY;state.detailTouchStartX=null;state.detailTouchStartY=null;const ax=Math.abs(dx),ay=Math.abs(dy);if(ax<55&&ay<55)return;if(ax>ay*1.15){navigateDetailDay(dx<0?1:-1);return}if(ay>ax*1.15){navigateDetailMeal(dy<0?1:-1)}}
function animateDetailNavigation(axis,delta){if(!els.detailImage.animate)return;const transform=axis==='x'?`translateX(${delta>0?'14px':'-14px'})`:`translateY(${delta>0?'14px':'-14px'})`;els.detailImage.animate([{opacity:.45,transform},{opacity:1,transform:'translate(0,0)'}],{duration:180,easing:'ease-out'})}
function navigateDetailDay(delta){const meal=state.detailMeal||state.meal,current=parseDateKey(state.selectedDate),year=current.getFullYear(),month=current.getMonth(),monthStart=new Date(year,month,1),monthEnd=new Date(year,month+1,0);let candidate=new Date(current);while(true){candidate.setDate(candidate.getDate()+delta);candidate.setHours(0,0,0,0);if(candidate<monthStart||candidate>monthEnd)return;if(candidate>state.today)return;const dateKey=toDateKey(candidate),record=state.records.get(recordKey(dateKey,meal));if(record?.fullBlob){state.selectedDate=dateKey;renderDetailPage();animateDetailNavigation('x',delta);return}}}
function navigateDetailMeal(delta){const meals=['breakfast','lunch','dinner','snack'],currentMeal=state.detailMeal||state.meal,currentIndex=meals.indexOf(currentMeal);if(currentIndex<0)return;for(let i=currentIndex+delta;i>=0&&i<meals.length;i+=delta){const targetMeal=meals[i],record=state.records.get(recordKey(state.selectedDate,targetMeal));if(record?.fullBlob){state.detailMeal=targetMeal;state.meal=targetMeal;renderDetailPage();animateDetailNavigation('y',delta);return}}}
function openDetailPage(meal=state.detailMeal||state.meal){state.detailMeal=meal;const record=state.records.get(recordKey(state.selectedDate,meal));if(!record?.fullBlob)return;renderDetailPage();showView('detail')}
function renderDetailPage(){const meal=state.detailMeal||state.meal;const record=state.records.get(recordKey(state.selectedDate,meal));if(!record?.fullBlob){requestCloseDetailModal();return}const date=parseDateKey(state.selectedDate);els.detailTitle.textContent=`${date.getMonth()+1}月${date.getDate()}日・${APP.mealNames[meal]}`;els.detailMealBadge.textContent=APP.mealNames[meal];els.detailMealBadge.className=`detail-meal-badge ${meal}`;cleanupDetailObjectUrl();state.detailObjectUrl=URL.createObjectURL(record.fullBlob);els.detailImage.src=state.detailObjectUrl;els.detailMemo.value=record.memo||'';renderDishName(record.memo||'');els.detailStatus.textContent='';els.replaceButton.disabled=date>state.today}
function renderDishName(value){const text=String(value||'').trim(),hasDishName=Boolean(text);els.captionBlock.textContent=text;els.captionBlock.hidden=!hasDishName;els.dishNameActions.hidden=!hasDishName;els.dishNameEditor.hidden=hasDishName}
function startDishNameEdit(){els.captionBlock.hidden=true;els.dishNameActions.hidden=true;els.dishNameEditor.hidden=false;els.detailStatus.textContent='';requestAnimationFrame(()=>{els.detailMemo.focus();els.detailMemo.setSelectionRange(els.detailMemo.value.length,els.detailMemo.value.length)})}
async function deleteDishNameValue(){const meal=state.detailMeal||state.meal,key=recordKey(state.selectedDate,meal),record=state.records.get(key);if(!record)return;if(!window.confirm('料理名を削除しますか？'))return;els.deleteDishName.disabled=true;try{await putRecord({...record,memo:'',updatedAt:new Date().toISOString()});await refreshRecords();const saved=state.records.get(key);if(String(saved?.memo||'').trim()!=='')throw new Error('料理名の削除を確認できませんでした');els.detailMemo.value='';renderDetailPage();renderCalendar();renderHome();els.detailStatus.textContent='料理名を削除しました。'}catch(error){console.error(error);els.detailStatus.textContent='料理名を削除できませんでした。もう一度お試しください。'}finally{els.deleteDishName.disabled=false}}
function requestCloseDetailModal(){if(history.state?.foodlogView==='detail'){history.back();return}closeDetailModalNow()}
function closeDetailModalNow(){cleanupDetailObjectUrl();state.detailMeal=null;renderCalendar();showView('calendar')}
async function saveDetailMemo(){const meal=state.detailMeal||state.meal,key=recordKey(state.selectedDate,meal),record=state.records.get(key);if(!record)return;const memo=els.detailMemo.value.trim();if(!memo){els.detailStatus.textContent='料理名を入力してください。';return}els.saveMemo.disabled=true;try{await putRecord({...record,memo,updatedAt:new Date().toISOString()});await refreshRecords();const saved=state.records.get(key);if(String(saved?.memo||'').trim()!==memo)throw new Error('料理名の保存を確認できませんでした');renderDetailPage();renderCalendar();renderHome();els.detailStatus.textContent='料理名を保存しました。'}catch(error){console.error(error);els.detailStatus.textContent='料理名を保存できませんでした。もう一度お試しください。'}finally{els.saveMemo.disabled=false}}
function changeMonth(delta){const candidate=new Date(state.viewedMonth.getFullYear(),state.viewedMonth.getMonth()+delta,1),min=startOfMonth(retentionStartDate()),max=startOfMonth(state.today);if(candidate<min||candidate>max)return;state.viewedMonth=candidate;renderCalendar()}
function startCapture(context){const selected=parseDateKey(context.date);if(selected>state.today)return;state.captureContext={...context};els.photoInput.value='';els.photoInput.click()}
async function handlePhotoSelection(event){const file=event.target.files?.[0];if(!file||!state.captureContext)return;if(!file.type.startsWith('image/'))return;try{const bitmap=await loadImage(file),fullBlob=await renderImageBlob(bitmap,APP.fullWidth,APP.fullHeight,APP.fullQuality),thumbBlob=await renderImageBlob(bitmap,APP.thumbWidth,APP.thumbHeight,APP.thumbQuality);if(typeof bitmap.close==='function')bitmap.close();state.pending={fullBlob,thumbBlob};await savePendingPhoto()}catch(error){console.error(error);state.captureContext=null}}
async function savePendingPhoto(){if(!state.pending||!state.captureContext)return;const ctx=state.captureContext,key=recordKey(ctx.date,ctx.meal),previous=state.records.get(key),beforeCount=mainMealCount(ctx.date),record={key,date:ctx.date,meal:ctx.meal,memo:previous?.memo||'',fullBlob:state.pending.fullBlob,thumbBlob:state.pending.thumbBlob,width:APP.fullWidth,height:APP.fullHeight,mimeType:'image/webp',quality:APP.fullQuality,updatedAt:new Date().toISOString()};await putRecord(record);await purgeExpiredRecords();await refreshRecords();const afterCount=mainMealCount(ctx.date);state.pending=null;if(ctx.returnView==='detail'){state.detailMeal=ctx.meal;state.selectedDate=ctx.date;renderDetailPage();showView('detail')}else{renderHome();showView('home')}state.captureContext=null;if(beforeCount===2&&afterCount===3)showMealCelebration()}
async function deleteSelectedRecord(){const meal=state.detailMeal||state.meal,key=recordKey(state.selectedDate,meal),record=state.records.get(key);if(!record)return;if(!window.confirm(`${formatDate(state.selectedDate)}・${APP.mealNames[meal]}の写真を削除しますか？`))return;await deleteRecord(key);await refreshRecords();renderHome();requestCloseDetailModal()}
async function loadImage(file){if('createImageBitmap'in window){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){return createImageBitmap(file)}}const url=URL.createObjectURL(file);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});return image}finally{URL.revokeObjectURL(url)}}
function renderImageBlob(source,width,height,quality){return new Promise((resolve,reject)=>{const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);const sw=source.width||source.naturalWidth,sh=source.height||source.naturalHeight,targetRatio=width/height,sourceRatio=sw/sh;let sx=0,sy=0,cropW=sw,cropH=sh;if(sourceRatio>targetRatio){cropW=sh*targetRatio;sx=(sw-cropW)/2}else if(sourceRatio<targetRatio){cropH=sw/targetRatio;sy=(sh-cropH)/2}ctx.drawImage(source,sx,sy,cropW,cropH,0,0,width,height);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Image conversion failed')),'image/webp',quality)})}
function refreshTodayIfNeeded(){const now=startOfDay(new Date());if(toDateKey(now)===toDateKey(state.today)){scheduleMidnightRefresh();return}state.today=now;state.viewedMonth=startOfMonth(now);state.selectedDate=toDateKey(now);purgeExpiredRecords().then(refreshRecords).then(()=>{renderHome();renderCalendar();scheduleMidnightRefresh()}).catch(()=>scheduleMidnightRefresh())}
function scheduleMidnightRefresh(){if(state.midnightTimer)clearTimeout(state.midnightTimer);const now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2);state.midnightTimer=setTimeout(refreshTodayIfNeeded,Math.max(1000,next-now))}
function normalizeMeal(meal){if(meal==='夜'||meal==='夜食'||meal==='夕'||meal==='夕食')return'dinner';if(meal==='朝'||meal==='朝食')return'breakfast';if(meal==='昼'||meal==='昼食')return'lunch';if(meal==='間'||meal==='間食')return'snack';return meal}function recordKey(date,meal){return`${date}_${normalizeMeal(meal)}`}function startOfDay(date){return new Date(date.getFullYear(),date.getMonth(),date.getDate())}function startOfMonth(date){return new Date(date.getFullYear(),date.getMonth(),1)}function toDateKey(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}function parseDateKey(key){const[y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)}function formatDate(key){const d=parseDateKey(key);return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}function formatDateWithWeekday(date){return`${date.getMonth()+1}月${date.getDate()}日（${['日','月','火','水','木','金','土'][date.getDay()]}）`}
function showMealCelebration(){document.querySelector('.celebration-layer')?.remove();const layer=document.createElement('div');layer.className='celebration-layer';const message=document.createElement('div');message.className='celebration-message';message.setAttribute('role','status');message.innerHTML='<span aria-hidden="true">✦ ✨ ✦</span><strong>3食コンプリート！</strong><small>今日もおいしく記録できました</small>';layer.appendChild(message);if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const colors=['#5b8bff','#ffba60','#ff8e99','#70cbb5','#b19af6'];for(let i=0;i<40;i++){const particle=document.createElement('i'),angle=(i/40)*Math.PI*2,radius=85+Math.random()*Math.min(155,window.innerWidth*.35);particle.className='celebration-particle '+(i%3===0?'is-dot':'is-star');particle.style.setProperty('--dx',Math.cos(angle)*radius+'px');particle.style.setProperty('--dy',Math.sin(angle)*radius+'px');particle.style.setProperty('--rot',(Math.random()*540-270)+'deg');particle.style.setProperty('--delay',(i%7*24)+'ms');particle.style.setProperty('--particle-color',colors[i%colors.length]);layer.appendChild(particle)}}document.body.appendChild(layer);window.setTimeout(()=>layer.remove(),2300)}
function setHomeStatus(message){els.homeStatus.textContent=message}function setCalendarStatus(message){els.calendarStatus.textContent=message}
function cleanupCalendarObjectUrls(){for(const url of state.calendarObjectUrls)URL.revokeObjectURL(url);state.calendarObjectUrls.clear()}function cleanupDetailObjectUrl(){if(state.detailObjectUrl){URL.revokeObjectURL(state.detailObjectUrl);state.detailObjectUrl=null}}function cleanupAllObjectUrls(){cleanupCalendarObjectUrls();cleanupDetailObjectUrl();if(state.midnightTimer)clearTimeout(state.midnightTimer)}
</script>
